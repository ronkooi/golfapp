<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3e2e"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle green terrain contour -->
  <path d="M 40 370 Q 200 320 320 360 T 472 350 L 472 472 L 40 472 Z" fill="#15803d" opacity="0.35"/>
  <path d="M 40 400 Q 180 370 280 400 T 472 380 L 472 472 L 40 472 Z" fill="#166534" opacity="0.45"/>
  
  <!-- Golf Cup / Hole -->
  <ellipse cx="270" cy="385" rx="42" ry="14" fill="#022c22"/>
  <ellipse cx="270" cy="386" rx="36" ry="10" fill="#000000"/>

  <!-- Flag Pole -->
  <line x1="270" y1="385" x2="270" y2="140" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Flag Pin Top Ball -->
  <circle cx="270" cy="136" r="8" fill="#f59e0b"/>

  <!-- Golf Flag -->
  <path d="M 270 145 L 180 185 L 270 225 Z" fill="url(#flag)"/>
  <text x="242" y="193" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff">9</text>

  <!-- Golf Ball -->
  <circle cx="370" cy="390" r="24" fill="url(#ball)"/>
  <circle cx="365" cy="384" r="3" fill="#cbd5e1"/>
  <circle cx="374" cy="384" r="3" fill="#cbd5e1"/>
  <circle cx="361" cy="391" r="3" fill="#cbd5e1"/>
  <circle cx="370" cy="392" r="3" fill="#cbd5e1"/>
  <circle cx="379" cy="391" r="3" fill="#cbd5e1"/>
  <circle cx="366" cy="399" r="3" fill="#cbd5e1"/>
  <circle cx="375" cy="398" r="3" fill="#cbd5e1"/>

  <!-- Text Badge -->
  <text x="256" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" fill="#34d399" text-anchor="middle" letter-spacing="4">ZEEGERSLOOT</text>
  <text x="256" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">GRIENDBAAN</text>
</svg>
